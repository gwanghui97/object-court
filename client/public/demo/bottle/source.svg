  <g stroke="#173d6b" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M233 179 l46 22" stroke-width="1.5"/>
    <path d="M223 271 l52 30" stroke-width="1.5"/>
    <path d="M277 325 l44 12" stroke-width="1.5"/>
