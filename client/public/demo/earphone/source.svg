<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="흰색 무선 이어폰 한 쌍과 충전 케이스">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6ee"/>
      <stop offset="1" stop-color="#c8d3df"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56677d"/>
      <stop offset="1" stop-color="#3f4e62"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8ee"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e0e8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#wall)"/>
  <rect y="340" width="512" height="172" fill="url(#desk)"/>
  <rect y="340" width="512" height="6" fill="#2f3b4b" opacity="0.5"/>

  <!-- 충전 케이스 -->
  <ellipse cx="256" cy="424" rx="128" ry="18" fill="#1d2632" opacity="0.4"/>
  <rect x="150" y="238" width="212" height="184" rx="52" fill="url(#shell)"/>
  <path d="M150 304 h212" stroke="#b9c3cf" stroke-width="4"/>
  <rect x="150" y="238" width="212" height="184" rx="52" fill="none" stroke="#c4cdd8" stroke-width="3"/>
  <circle cx="256" cy="336" r="6" fill="#9aa7b6"/>
  <rect x="236" y="298" width="40" height="12" rx="6" fill="#c4cdd8"/>
  <rect x="172" y="258" width="16" height="140" rx="8" fill="#ffffff" opacity="0.7"/>

  <!-- 왼쪽 이어폰 -->
  <g transform="rotate(-14 150 150)">
    <ellipse cx="150" cy="232" rx="40" ry="8" fill="#1d2632" opacity="0.18"/>
    <rect x="138" y="126" width="24" height="96" rx="12" fill="url(#bud)" stroke="#c4cdd8" stroke-width="2"/>
    <circle cx="150" cy="112" r="38" fill="url(#bud)" stroke="#c4cdd8" stroke-width="2"/>
    <ellipse cx="178" cy="104" rx="14" ry="20" fill="#8e9bab"/>
    <ellipse cx="181" cy="104" rx="7" ry="12" fill="#5f6c7c"/>
    <rect x="144" y="206" width="12" height="10" rx="3" fill="#aab5c2"/>
    <circle cx="136" cy="98" r="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 오른쪽 이어폰 -->
  <g transform="rotate(14 362 150)">
    <ellipse cx="362" cy="232" rx="40" ry="8" fill="#1d2632" opacity="0.18"/>
    <rect x="350" y="126" width="24" height="96" rx="12" fill="url(#bud)" stroke="#c4cdd8" stroke-width="2"/>
    <circle cx="362" cy="112" r="38" fill="url(#bud)" stroke="#c4cdd8" stroke-width="2"/>
    <ellipse cx="334" cy="104" rx="14" ry="20" fill="#8e9bab"/>
    <ellipse cx="331" cy="104" rx="7" ry="12" fill="#5f6c7c"/>
    <rect x="356" y="206" width="12" height="10" rx="3" fill="#aab5c2"/>
    <circle cx="376" cy="98" r="6" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
